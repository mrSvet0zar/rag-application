services:
  db:
    # pgvector image = PostgreSQL 16 with the pgvector extension preinstalled.
    image: pgvector/pgvector:pg16
    container_name: rag_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rag_user
      POSTGRES_PASSWORD: rag_password
      POSTGRES_DB: rag_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # No schema seeding here: the backend owns the schema and applies
      # Alembic migrations at startup (see backend/alembic/).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag_user -d rag_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
