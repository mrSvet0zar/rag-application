# Railway service config for the backend.
# In the Railway dashboard, set this service's *Root Directory* to `backend`
# so this file and the Dockerfile are picked up.

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
# Readiness, not liveness: a container whose database is unreachable should
# not be given traffic, even though its process is perfectly alive.
healthcheckPath = "/api/ready"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
